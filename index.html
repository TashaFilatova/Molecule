<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link href="styles/main.css" rel="stylesheet">

    <title>Меню</title>
</head>
<body>
    <header class="header">
        <div class="logo">
            <a href="index.html" title="На главную страницу">
                <img src="images/logo.png" alt="логотип кофейни">
            </a>
        </div>
        <nav class="menu">
            <a href="#">Каталог</a>
            <a href="#">Акции</a>
            <a href="#">Отзывы</a>
            <a href="#">FAQ</a>
            <a href="#">Контакты</a>
        </nav>
        <div class="pink-bar">
        </div>
        <div class="doughnut">
        </div>
    
    </header>
    <main class="main">
        <section class="offer">
            <div class="offer-header">
                <div class="offer-image">
                    <img src="images/cupofcoffee.png" alt="Чашка с кофе">
                </div>
                <h1 class="new-position">Новинка</h1>
                <p class="price">
                    <span class="price-value">4,8 BYN </span><sup class="price-volume">300 мл</sup>
                </p>
                <h1 class="offer-title">БАУНТИ</h1>
            </div>  
            <div class="description">
                <p>Это кофейный напиток, который готовится из эспрессо, сливок и сахара 
                    (простого и ванильного). Его можно назвать кофейно-молочным коктейлем
                     или десертом, так как он очень вкусный, сладкий, нежный, в чем-то напоминает крем-брюле.
                </p>
            </div>
        
        </section>
    </main>
</body>    
</html>
